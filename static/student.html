<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUPIL ZERO — Student Hub</title><link rel="stylesheet" href="/static/style.css">
<style>.hub{max-width:1000px;margin:32px auto}.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.hub-card{background:#171b35;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.hub-item{padding:12px;border-bottom:1px solid var(--line);line-height:1.8}.muted{color:var(--muted);font-size:13px}.hub button{margin:6px}</style></head>
<body><main class="shell hub"><header class="topbar"><a class="brand" href="/">PUPIL<span>ZERO</span></a><span class="tag">STUDENT HUB</span><a href="/">ابدأ التعلم</a></header>
<section class="hero-copy"><p class="eyebrow">مساحتك التعليمية</p><h1>أهلاً بيك في يومك الدراسي</h1><p class="sub" id="welcome">جاري تحميل جدولك وواجباتك...</p></section>
<div class="hub-grid"><section class="hub-card"><h2>جدول الحصص</h2><div id="timetable"></div></section><section class="hub-card"><h2>واجباتي</h2><div id="assignments"></div></section><section class="hub-card"><h2>سجل الحضور</h2><div id="attendance"></div></section><section class="hub-card"><h2>الإشعارات</h2><div id="notifications"></div></section></div>
<p class="muted">المعلومات المعروضة هي سجلات تشغيلية مقدمة من المدرسة، وليست درجات أو تقييمًا معتمدًا للإتقان.</p><footer><a href="/account">الحسابات</a> · <a href="/parent">بوابة ولي الأمر</a></footer></main>
<script>
const $=id=>document.getElementById(id);async function get(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.detail||'تعذر تحميل البيانات');return d}
function add(root,title,detail,button){const box=document.createElement('div');box.className='hub-item';const strong=document.createElement('strong');strong.textContent=title;const p=document.createElement('p');p.className='muted';p.textContent=detail;box.append(strong,p);if(button)box.append(button);root.append(box)}
async function load(){try{const me=await get('/api/auth/me');if(me.user.role!=='student')throw new Error('سجّل الدخول بحساب طالب لعرض هذه الصفحة');$('welcome').textContent='مرحبًا '+me.user.display_name;const d=await get('/api/student/dashboard');$('timetable').innerHTML='';d.timetable.forEach(x=>add($('timetable'),['الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت','الأحد'][x.day_of_week]+' · '+x.start_time+'–'+x.end_time,x.class_name+' · '+x.subject_name+' · '+x.teacher_name));if(!d.timetable.length)add($('timetable'),'لا يوجد جدول منشور','سيظهر جدولك هنا عند ربط فصلك بجدول المدرسة.');$('assignments').innerHTML='';d.assignments.forEach(x=>add($('assignments'),x.title+' · '+(x.submitted?'تم التسليم':'مطلوب'),x.class_name+' · '+(x.due_at||'لا يوجد موعد تسليم')));if(!d.assignments.length)add($('assignments'),'لا توجد واجبات','ستظهر الواجبات الجديدة هنا.');$('attendance').innerHTML='';d.attendance.forEach(x=>add($('attendance'),x.attendance_date+' · '+x.status,x.class_name));if(!d.attendance.length)add($('attendance'),'لا يوجد سجل حضور','لم تُسجل حالات حضور بعد.');$('notifications').innerHTML='';d.notifications.forEach(x=>{const b=document.createElement('button');b.className='ghost';b.textContent=x.read_at?'مقروء':'تحديد كمقروء';b.onclick=async()=>{await fetch('/api/notifications/'+encodeURIComponent(x.id)+'/read',{method:'POST'});load()};add($('notifications'),x.title,x.body+' · '+x.created_at,b)});if(!d.notifications.length)add($('notifications'),'لا توجد إشعارات','ستظهر الواجبات وتحديثات الحضور هنا.')}catch(e){$('welcome').textContent=e.message}}
load();
</script></body></html>
